name: Flutter Build

on:
  push:
  workflow_dispatch:
    inputs:
      build_web:
        description: Build Web
        type: boolean
        default: true
      build_android:
        description: Build Android
        type: boolean
        default: true
      build_windows:
        description: Build Windows
        type: boolean
        default: false
      build_ios:
        description: Build iOS
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # lib/generated/build_info.dart is gitignored; the action creates a
      # placeholder because the Gradle task "generateBuildInfo" only runs in
      # the Android build.
      - uses: ./.github/actions/setup-flutter

      - run: flutter test

  build-android:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.build_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - id: flutter
        uses: ./.github/actions/setup-flutter
        with:
          build_info_placeholder: 'false'

      # android/app/build.gradle.kts uses flutter.ndkVersion; read it from the
      # Flutter SDK so the cache key follows Flutter upgrades. The env context
      # does not contain runner variables such as ANDROID_HOME, so expose the
      # cache path as a step output.
      - name: Read NDK version
        id: ndk
        run: |
          version=$(grep -oP 'val ndkVersion: String = "\K[^"]+' "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "path=$ANDROID_HOME/ndk/$version" >> "$GITHUB_OUTPUT"

      - name: Cache Android NDK
        uses: actions/cache@v5
        with:
          path: ${{ steps.ndk.outputs.path }}
          key: android-ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}

      - name: Create secrets.json
        uses: ./.github/actions/create-secrets
        with:
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          llm_api_base: ${{ vars.LLM_API_BASE }}
          llm_model: ${{ vars.LLM_MODEL }}

      # android/app/build.gradle.kts reads android/key.properties for release signing.
      - name: Configure release signing
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > app/keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "keyAlias=upload"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > key.properties

      - name: Build APK
        run: flutter build apk --release --split-per-abi --dart-define-from-file=secrets.json

      - name: Archive APK
        uses: actions/upload-artifact@v7
        with:
          name: LE-Skate-Android-Release-${{ steps.flutter.outputs.version }}
          path: build/app/outputs/apk/release/*.apk
          archive: true

  build-windows:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - id: flutter
        uses: ./.github/actions/setup-flutter

      - name: Create secrets.json
        uses: ./.github/actions/create-secrets
        with:
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          llm_api_base: ${{ vars.LLM_API_BASE }}
          llm_model: ${{ vars.LLM_MODEL }}

      - name: Build Windows Release
        run: flutter build windows --release --dart-define-from-file=secrets.json

      - name: Archive Windows build
        uses: actions/upload-artifact@v7
        with:
          name: LE-Skate-Windows-Release-${{ steps.flutter.outputs.version }}
          path: build/windows/x64/runner/Release/
          archive: true

  build-web:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.build_web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: flutter
        uses: ./.github/actions/setup-flutter

      - name: Create secrets.json
        uses: ./.github/actions/create-secrets
        with:
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          llm_api_base: ${{ vars.LLM_API_BASE }}
          llm_model: ${{ vars.LLM_MODEL }}

      # Add --pwa-strategy=none to disable the Flutter service worker so that
      # F5 fetches fresh content. GitHub Pages still caches files for 10 min.
      - name: Build Web Release
        run: flutter build web --release --base-href /LE-Skate/ --dart-define-from-file=secrets.json

      - name: Archive Web build
        uses: actions/upload-artifact@v7
        with:
          name: LE-Skate-Web-Release-${{ steps.flutter.outputs.version }}
          path: build/web/
          archive: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web/

  deploy-pages:
    needs: build-web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  build-ios:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - id: flutter
        uses: ./.github/actions/setup-flutter

      - name: Create secrets.json
        uses: ./.github/actions/create-secrets
        with:
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          llm_api_base: ${{ vars.LLM_API_BASE }}
          llm_model: ${{ vars.LLM_MODEL }}

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign --dart-define-from-file=secrets.json

      - name: Package IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r "LE_Skate_Release_Unsigned_${{ steps.flutter.outputs.version }}.ipa" Payload

      - uses: actions/upload-artifact@v7
        with:
          name: LE-Skate-iOS-Release-Unsigned-${{ steps.flutter.outputs.version }}
          path: build/ios/iphoneos/LE_Skate_*.ipa
          archive: false