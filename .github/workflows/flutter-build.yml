name: Flutter Build

on: [push]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
          pub-cache: true

      - run: flutter pub get

      # lib/generated/build_info.dart is gitignored and normally generated by
      # the Gradle task "generateBuildInfo" (android/app/build.gradle.kts)
      # during the Android build's preBuild step. `flutter test` runs before
      # that task, so create a placeholder here to keep the import resolvable.
      - name: Generate build_info.dart placeholder
        run: |
          mkdir -p lib/generated
          printf "const String kBuildTimestamp = 'dev';\n" > lib/generated/build_info.dart

      - run: flutter test

  build-android:
    needs: test
    runs-on: ubuntu-latest
    #    strategy:
    #      fail-fast: true
    #      matrix:
    #        build_type: [release, debug]
    steps:
      - uses: actions/checkout@v7

      # cedvdb/action-flutter-build-android only installs its own JDK 17 if no
      # java is found. Set up JDK 21 first so the Android build compiles against
      # Java 21 (matching sourceCompatibility/targetCompatibility in build.gradle.kts).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create secrets.json
        uses: ./.github/actions/create-secrets
        with:
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          llm_api_base: ${{ vars.LLM_API_BASE }}
          llm_model: ${{ vars.LLM_MODEL }}

      - uses: cedvdb/action-flutter-build-android@v1
        with:
          keystore-base64: ${{ secrets.ANDROID_RELEASE_KEY }}
          keystore-password: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          build-cmd: flutter build apk --release --dart-define-from-file=secrets.json
          working-directory: ./

      # Extract the app version from pubspec.yaml (e.g. "0.1.2" from
      # "version: 0.1.2+3") to include it in the artifact name below.
      - name: Read app version
        id: app_version
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version:\s*//' | cut -d '+' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Archive APK
        uses: actions/upload-artifact@v7
        with:
          name: LE-Skate-Android-arm64-Release-${{ steps.app_version.outputs.version }}
          path: build/app/outputs/apk/release/*.apk
          archive: false

  build-windows:
    needs: test
    if: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
          pub-cache: true

      - run: flutter pub get

      - name: Generate build_info.dart placeholder
        run: |
          New-Item -ItemType Directory -Force -Path lib/generated | Out-Null
          Set-Content lib/generated/build_info.dart "const String kBuildTimestamp = 'dev';"

      - name: Create secrets.json
        uses: ./.github/actions/create-secrets
        with:
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          llm_api_base: ${{ vars.LLM_API_BASE }}
          llm_model: ${{ vars.LLM_MODEL }}

      - name: Build Windows Release
        run: flutter build windows --release --dart-define-from-file=secrets.json

      - name: Read app version
        id: app_version
        run: |
          $version = (Get-Content pubspec.yaml | Select-String '^version:').ToString() -replace 'version:\s*', '' -replace '\+.*', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Archive Windows build
        uses: actions/upload-artifact@v7
        with:
          name: LE-Skate-Windows-Release-${{ steps.app_version.outputs.version }}
          path: build/windows/x64/runner/Release/
          archive: true

  build-web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
          pub-cache: true

      - run: flutter pub get

      - name: Generate build_info.dart placeholder
        run: |
          mkdir -p lib/generated
          printf "const String kBuildTimestamp = 'dev';\n" > lib/generated/build_info.dart

      - name: Create secrets.json
        uses: ./.github/actions/create-secrets
        with:
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          llm_api_base: ${{ vars.LLM_API_BASE }}
          llm_model: ${{ vars.LLM_MODEL }}

      - name: Build Web Release
        run: flutter build web --release --base-href /LE-Skate/ --dart-define-from-file=secrets.json

      - name: Read app version
        id: app_version
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version:\s*//' | cut -d '+' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Archive Web build
        uses: actions/upload-artifact@v7
        with:
          name: LE-Skate-Web-Release-${{ steps.app_version.outputs.version }}
          path: build/web/
          archive: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  deploy-pages:
    needs: build-web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  build-ios:
    needs: test
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
          pub-cache: true

      - run: flutter pub get

      - name: Generate build_info.dart placeholder
        run: |
          mkdir -p lib/generated
          printf "const String kBuildTimestamp = 'dev';\n" > lib/generated/build_info.dart

      - name: Create secrets.json
        uses: ./.github/actions/create-secrets
        with:
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          llm_api_base: ${{ vars.LLM_API_BASE }}
          llm_model: ${{ vars.LLM_MODEL }}

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign --dart-define-from-file=secrets.json

      - name: Read app version
        id: app_version
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version:\s*//' | cut -d '+' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package IPA
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:\s*//' | cut -d '+' -f1)
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r "LE_Skate_Release_Unsigned_${VERSION}.ipa" Payload
          cd ../../..

      - uses: actions/upload-artifact@v7
        with:
          name: LE-Skate-iOS-Release-Unsigned-${{ steps.app_version.outputs.version }}
          path: build/ios/iphoneos/LE_Skate_*.ipa
          archive: false